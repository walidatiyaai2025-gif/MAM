<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Diwan Al Amiri Media Asset Management</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/fonts.css" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/premium-ui.css" />
  <link rel="stylesheet" href="/premium-runtime-v2.css" />
  <link rel="stylesheet" href="/p126-experience.css" />
  <link rel="stylesheet" href="/p127-enterprise.css" />
  <link rel="stylesheet" href="/p128-reference-ui.css" />
  <link rel="stylesheet" href="/p128-media-previews.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="brand">
        <img src="/assets/branding/diwan-al-amiri-crest.png" alt="Diwan Al Amiri crest" />
        <div><strong>الديوان الأميري</strong><span>MEDIA ASSET MANAGEMENT</span></div>
      </div>
      <nav id="nav">
        <button data-route="dashboard">Dashboard</button>
        <button data-route="library">Media Library</button>
        <button data-route="asset" hidden aria-hidden="true" tabindex="-1">Asset Details</button>
        <button data-route="ingest">New Ingest</button>
        <button data-route="upload">Add Media</button>
        <button data-route="queue">Processing Queue</button>
        <button data-route="reports">Reports</button>
        <button data-route="admin">Administration</button>
        <button data-route="settings">Settings</button>
      </nav>
      <div class="nonprod"><strong>PRODUCTION</strong><span id="buildIdentity">MAM</span></div>
    </aside>

    <main>
      <header class="topbar">
        <div><small>DIWAN AL AMIRI · MEDIA ASSET MANAGEMENT</small><h1 id="pageTitle">Dashboard</h1></div>
        <div class="actions"><a href="/" class="btn btn-sm btn-outline-secondary" title="Landing page"><i class="bi bi-house-door"></i></a><span class="status">● Central services</span><button id="languageButton">العربية</button></div>
      </header>
      <section id="content" class="content" aria-live="polite"></section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/app.js"></script>
  <script src="/p03-upload.js"></script>
  <script src="/p04-processing.js"></script>
  <script src="/p05-curation.js"></script>
  <script src="/p06-protection.js"></script>
  <script src="/p08-administration.js"></script>
  <script src="/p09-operations.js"></script>
  <script src="/p12-function-actions.js"></script>
  <script src="/p12-discovery.js"></script>
  <script src="/p12-upload-capabilities.js"></script>
  <script src="/p12-legacy-action-guard.js"></script>
  <script src="/ui-localization.js"></script>
  <script>
    const languageSwitch = document.getElementById('languageButton');
    languageSwitch.addEventListener('click', () => {
      requestAnimationFrame(() => {
        document.documentElement.scrollLeft = 0;
        document.body.scrollLeft = 0;
        window.scrollTo({ left: 0, top: window.scrollY, behavior: 'auto' });
      });
    });
  </script>
  <script src="/production-runtime.js"></script>
  <script src="/premium-runtime-v2.js"></script>
  <script src="/p126-experience-v2.js"></script>
  <script src="/p127-enterprise-v2.js"></script>
  <script src="/p128-reference-ui.js"></script>
  <script src="/p128-media-previews.js"></script>
</body>
</html>
