  <script>
    /* p132 must capture the browser platform primitive, not an earlier runtime
       wrapper with stale locale state. p132 becomes the only authoritative
       History owner immediately after this reset. */
    history.replaceState = History.prototype.replaceState.bind(history);

    /* The URL/localStorage locale is the durable state across sequential
       language clicks. Normalize a possibly stale asynchronous DOM locale from
       that durable state before p132 computes the next toggle direction. */
    window.addEventListener('click', event => {
      if (!(event.target instanceof Element) || !event.target.closest('[data-p128-language],#languageButton')) return;
      try {
        const urlLanguage = new URL(location.href).searchParams.get('lang');
        const storedLanguage = localStorage.getItem('mam.language');
        const durableLanguage = urlLanguage === 'ar' || urlLanguage === 'en'
          ? urlLanguage
          : (storedLanguage === 'ar' || storedLanguage === 'en' ? storedLanguage : null);
        if (!durableLanguage) return;
        const durableArabic = durableLanguage === 'ar';
        document.documentElement.lang = durableLanguage;
        document.documentElement.dir = durableArabic ? 'rtl' : 'ltr';
        try { arabic = durableArabic; } catch { }
        try { window.arabic = durableArabic; } catch { }
      } catch { }
    }, true);
  </script>
  <script src="/p132-navigation-final.js?v=0.12.19-p12.16"></script>
  <script>
    (() => {
      'use strict';

      /* Final inline language owner. It is registered after p132 in the same
         parser turn, so no external-loader timing can race the acceptance path. */
      const nativeReplaceState = History.prototype.replaceState;
      let generation = 0;
      let enforcementTimer = 0;

      const currentLanguage = () => document.documentElement.lang === 'ar' ? 'ar' : 'en';
      const languageControl = event => event.target instanceof Element
        ? event.target.closest('[data-p128-language],#languageButton')
        : null;

      const actionStateSelector = '#p04ActionState,#p04QueueActionState,[id$="ActionState"],#p133MutationState';
      const passiveDisplay = new WeakMap();
      const normalize = value => String(value || '').replace(/\s+/g, ' ').trim();

      function rememberPassiveStates() {
        document.querySelectorAll('#content .state').forEach(state => {
          if (!(state instanceof HTMLElement) || state.closest(actionStateSelector)) return;
          if (!passiveDisplay.has(state)) passiveDisplay.set(state, state.style.display);
        });
      }

      function reconcilePassivePromotion() {
        rememberPassiveStates();
        const passiveMessages = new Set();
        document.querySelectorAll('#content .state[data-mam-popup-promoted="1"]').forEach(state => {
          if (!(state instanceof HTMLElement) || state.closest(actionStateSelector)) return;
          const message = normalize(state.textContent);
          if (message) passiveMessages.add(message);
          if (passiveDisplay.has(state)) state.style.display = passiveDisplay.get(state) || '';
        });
        if (!passiveMessages.size) return;
        document.querySelectorAll('#mamPopupStack .mam-popup').forEach(popup => {
          const message = normalize(popup.querySelector('.mam-popup-copy p')?.textContent);
          if (message && passiveMessages.has(message)) popup.remove();
        });
        const stack = document.getElementById('mamPopupStack');
        if (stack && !stack.children.length) stack.remove();
      }

      rememberPassiveStates();
      const passiveObserver = new MutationObserver(() => queueMicrotask(reconcilePassivePromotion));
      passiveObserver.observe(document.body, { childList:true, subtree:true, characterData:true });
      queueMicrotask(reconcilePassivePromotion);

      try { window.arabic = currentLanguage() === 'ar'; } catch { }

      window.addEventListener('click', event => {
        if (!languageControl(event)) return;

        const snapshot = new URL(location.href);
        const targetLanguage = currentLanguage() === 'ar' ? 'en' : 'ar';
        const targetArabic = targetLanguage === 'ar';
        const currentGeneration = ++generation;
        const startedAt = performance.now();

        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();

        try {
          window.arabic = targetArabic;
          arabic = targetArabic;
          localStorage.setItem('mam.p128.language.initialized', '1');
          localStorage.setItem('mam.language', targetLanguage);
          if (typeof render === 'function') render();
          window.arabic = targetArabic;
        } catch { }

        const enforce = () => {
          if (currentGeneration !== generation) return;
          try {
            const url = new URL(snapshot.href);
            url.searchParams.set('lang', targetLanguage);
            nativeReplaceState.call(history, history.state, '', url.href);
            localStorage.setItem('mam.language', targetLanguage);
            localStorage.setItem('mam.p128.language.initialized', '1');
            window.arabic = targetArabic;
          } catch { }
          reconcilePassivePromotion();
        };

        const enforceFrame = now => {
          if (currentGeneration !== generation) return;
          enforce();
          if (now - startedAt < 1200) requestAnimationFrame(enforceFrame);
        };

        if (enforcementTimer) clearInterval(enforcementTimer);
        enforce();
        queueMicrotask(enforce);
        requestAnimationFrame(enforceFrame);
        enforcementTimer = setInterval(enforce, 10);
        [0, 40, 80, 120, 180, 240, 400, 700, 1000, 1300].forEach(delay => setTimeout(enforce, delay));
        setTimeout(() => {
          if (currentGeneration !== generation) return;
          enforce();
          if (enforcementTimer) {
            clearInterval(enforcementTimer);
            enforcementTimer = 0;
          }
        }, 1500);
      }, true);
    })();
  </script>
  <script>
    (() => {
      const card = document.querySelector('.sidebar > .nonprod');
      if (!card) return;

      let shaLine = document.getElementById('runtimeCommitSha');
      if (!shaLine) {
        shaLine = document.createElement('span');
        shaLine.id = 'runtimeCommitSha';
        shaLine.setAttribute('aria-label', 'Runtime commit SHA');
        shaLine.style.marginTop = '4px';
        shaLine.style.fontFamily = 'Consolas, monospace';
        shaLine.style.fontSize = '10px';
        shaLine.style.color = '#F6D77B';
        shaLine.style.letterSpacing = '.02em';
        shaLine.style.wordBreak = 'break-all';
        shaLine.textContent = 'SHA: loading…';
        card.appendChild(shaLine);
      }

      fetch('/version', {
        cache: 'no-store',
        headers: { 'Accept': 'application/json' }
      })
        .then(response => response.ok ? response.json() : Promise.reject(new Error(`HTTP ${response.status}`)))
        .then(version => {
          const fullSha = String(version.commitSha || '').trim();
          if (!fullSha) throw new Error('commitSha missing');
          const shortSha = fullSha.slice(0, 12);
          shaLine.textContent = `SHA: ${shortSha}`;
          shaLine.title = `Commit: ${fullSha}${version.buildNumber ? ` · Build: ${version.buildNumber}` : ''}`;
          shaLine.dataset.fullSha = fullSha;
        })
        .catch(() => {
          shaLine.textContent = 'SHA: unavailable';
          shaLine.title = 'Runtime version endpoint unavailable';
        });
    })();
  </script>
