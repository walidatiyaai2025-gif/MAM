<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>إدارة الأشرطة · Tape Management</title>
  <link rel="stylesheet" href="/fonts.css" />
  <link rel="stylesheet" href="/t22-tape-management.css" />
</head>
<body>
  <header class="t22-head">
    <div class="t22-brand">
      <img src="/assets/branding/diwan-al-amiri-crest.png" alt="شعار الديوان الأميري" />
      <div><strong>الديوان الأميري</strong><span>Media Asset Management</span></div>
    </div>
    <div class="t22-head-actions">
      <button type="button" id="t22Language">English</button>
      <a href="/app#route=dashboard" id="t22Back">العودة للنظام</a>
    </div>
  </header>

  <main class="t22-page">
    <section class="t22-title">
      <div>
        <span class="eyebrow">T2.2 · TAPE MANAGEMENT</span>
        <h1 id="t22Title">إدارة الأشرطة</h1>
        <p id="t22Subtitle">إدارة وفهرسة الأشرطة المادية، والبحث والباركود والطباعة. الرقمنة تتم خارج MAM.</p>
      </div>
      <button type="button" class="primary" id="t22Create">إضافة شريط</button>
    </section>

    <div id="t22Status" aria-live="polite"></div>

    <section class="t22-card">
      <div class="t22-search-grid">
        <label>
          <span id="t22SearchLabel">بحث نصي</span>
          <input id="t22Query" maxlength="512" placeholder="رقم الشريط، الاسم، الرقم القديم، الإدارة، الموقع..." />
        </label>
        <label>
          <span id="t22ScanLabel">مسح الباركود</span>
          <input id="t22Scan" maxlength="2048" autocomplete="off" placeholder="امسح الباركود أو الصق القيمة" />
        </label>
        <label>
          <span id="t22FormatFilterLabel">النوع</span>
          <select id="t22FormatFilter"><option value="">الكل</option></select>
        </label>
        <label>
          <span id="t22DepartmentFilterLabel">الإدارة</span>
          <select id="t22DepartmentFilter"><option value="">الكل</option></select>
        </label>
        <label>
          <span id="t22StatusFilterLabel">حالة الرقمنة</span>
          <select id="t22DigitizationFilter"><option value="">الكل</option></select>
        </label>
      </div>
      <div class="t22-actions">
        <button type="button" class="primary" id="t22Search">بحث</button>
        <button type="button" id="t22ScanButton">فتح نتيجة المسح</button>
        <button type="button" id="t22Reset">مسح الفلاتر</button>
        <button type="button" id="t22ManageFormats">إدارة الأنواع</button>
        <button type="button" id="t22ManageDepartments">إدارة الإدارات</button>
      </div>
    </section>

    <section class="t22-card">
      <div class="t22-list-head">
        <h2 id="t22ResultsTitle">الأشرطة</h2>
        <span id="t22Count">0</span>
      </div>
      <div id="t22Rows" class="t22-list"></div>
    </section>
  </main>

  <div id="t22ModalHost"></div>
  <script src="/t22-barcode.js"></script>
  <script src="/t22-tape-management.js"></script>
</body>
</html>
