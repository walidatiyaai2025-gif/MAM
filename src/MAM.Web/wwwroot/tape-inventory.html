<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tape Inventory · Diwan Al Amiri MAM</title>
  <style>
    :root{--navy:#07182e;--navy2:#0a2342;--gold:#b58a2a;--bg:#f5f7fa;--line:#e4e7ec;--muted:#667085;--danger:#b42318;--ok:#027a48}
    *{box-sizing:border-box} body{margin:0;font-family:Segoe UI,Tahoma,Arial,sans-serif;background:var(--bg);color:#101828}
    header{background:var(--navy);color:#fff;padding:20px 28px;border-bottom:3px solid var(--gold);display:flex;gap:16px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
    header h1{font-size:22px;margin:0} header small{color:#e0c98a}.actions{display:flex;gap:8px;flex-wrap:wrap}
    button,.button{border:0;border-radius:9px;padding:10px 14px;font-weight:600;cursor:pointer}.primary{background:var(--gold);color:white}.ghost{background:white;color:var(--navy);border:1px solid var(--line)}
    main{max-width:1500px;margin:0 auto;padding:26px}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:20px}.hero h2{font-size:30px;margin:0 0 6px;color:var(--navy2)}.hero p{margin:0;color:var(--muted)}
    .toolbar,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 16px rgba(16,24,40,.04)}.toolbar{padding:14px;display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:10px;margin-bottom:14px}
    input,select,textarea{width:100%;border:1px solid #d0d5dd;border-radius:8px;padding:10px 11px;background:white;color:#101828;font:inherit}textarea{min-height:88px;resize:vertical}.search{font-size:15px}
    .panel{overflow:hidden}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:980px}th,td{padding:13px 14px;border-bottom:1px solid #eaecf0;text-align:start;vertical-align:top}th{background:#f9fafb;color:#475467;font-size:12px;text-transform:uppercase;letter-spacing:.04em}tr[data-id]{cursor:pointer}tr[data-id]:hover{background:#fffcf4}.code{font-weight:700;color:var(--navy2);white-space:nowrap}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:12px;background:#eef4ff;color:#3538cd}.muted{color:var(--muted)}
    .empty,.error,.loading{padding:34px;text-align:center}.error{color:var(--danger)}.loading{color:var(--muted)}
    dialog{width:min(960px,calc(100vw - 28px));border:0;border-radius:16px;padding:0;box-shadow:0 24px 70px rgba(16,24,40,.25)}dialog::backdrop{background:rgba(7,24,46,.62)}.dialog-head{padding:20px 22px;background:var(--navy2);color:white;display:flex;align-items:center;justify-content:space-between}.dialog-head h3{margin:0}.dialog-body{padding:20px 22px;max-height:72vh;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.span2{grid-column:span 2}.span3{grid-column:span 3}label{font-size:13px;font-weight:600;color:#344054;display:block;margin-bottom:6px}.dialog-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.status{font-size:13px;margin-inline-end:auto;align-self:center}.status.ok{color:var(--ok)}.status.bad{color:var(--danger)}
    @media(max-width:760px){header{padding:15px 16px}.hero{display:block}.hero .actions{margin-top:14px}main{padding:16px}.toolbar{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.span2,.span3{grid-column:span 1}.dialog-body{padding:16px}}
  </style>
</head>
<body>
<header>
  <div><h1 id="brand">Diwan Al Amiri · MAM</h1><small id="phase">Phase Two · Tape Inventory</small></div>
  <div class="actions"><a class="button ghost" href="/app" id="back">Back to MAM</a><button class="ghost" id="lang">العربية</button></div>
</header>
<main>
  <section class="hero"><div><h2 id="title">Tape Inventory</h2><p id="subtitle">Physical tape catalog. Digitization is performed outside MAM.</p></div><div class="actions"><button class="primary" id="newTape">+ New tape</button></div></section>
  <section class="toolbar"><input id="query" class="search" placeholder="Search tape code, legacy number, title, location…"/><button class="ghost" id="refresh">Refresh</button></section>
  <section class="panel"><div id="state" class="loading">Loading tape inventory…</div><div class="table-wrap" id="tableWrap" hidden><table><thead><tr><th id="hCode">Tape code</th><th id="hTitle">Title</th><th id="hFormat">Format</th><th id="hLegacy">Legacy no.</th><th id="hLocation">Location</th><th id="hCondition">Condition</th><th id="hStatus">Digitization</th><th id="hUpdated">Updated</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main>
<dialog id="editor">
  <form method="dialog" id="form">
    <div class="dialog-head"><h3 id="editorTitle">New tape</h3><button value="cancel" class="ghost" aria-label="Close">×</button></div>
    <div class="dialog-body"><div class="grid">
      <div><label id="lCode">Tape code</label><input id="tapeCode" disabled placeholder="Allocated on save"/></div>
      <div><label id="lLegacy">Legacy number</label><input id="legacyNumber" maxlength="128"/></div>
      <div><label id="lFormat">Tape format</label><select id="tapeFormat"><option value="">Unknown</option></select></div>
      <div class="span2"><label id="lTitle">Title</label><input id="tapeTitle" maxlength="512"/></div>
      <div><label id="lCondition">Physical condition</label><select id="condition"><option value="">Unknown</option><option>Good</option><option>Fair</option><option>Poor</option><option>Damaged</option></select></div>
      <div class="span3"><label id="lDescription">Description</label><textarea id="description"></textarea></div>
      <div><label id="lOwner">Owner / department</label><input id="ownerDepartment" maxlength="256"/></div>
      <div><label id="lDuration">Duration (seconds)</label><input id="durationSeconds" type="number" min="0"/></div>
      <div><label id="lDate">Recording date</label><input id="recordingDate" type="date"/></div>
      <div><label id="lRoom">Room</label><input id="room" maxlength="128"/></div><div><label id="lCabinet">Cabinet</label><input id="cabinet" maxlength="128"/></div><div><label id="lShelf">Shelf</label><input id="shelf" maxlength="128"/></div><div><label id="lBin">Bin</label><input id="bin" maxlength="128"/></div>
      <div class="span2"><label id="lStatus">Digitization status</label><select id="digitizationStatus"><option>NotDigitized</option><option>SentForDigitization</option><option>PartiallyDigitized</option><option>DigitizedFileReceived</option><option>Uploaded</option><option>QcPending</option><option>QcApproved</option><option>Completed</option></select></div>
      <div class="span3"><label id="lNotes">Notes</label><textarea id="notes"></textarea></div>
    </div></div>
    <div class="dialog-foot"><span class="status" id="saveStatus"></span><button value="cancel" class="ghost" id="cancel">Cancel</button><button type="button" class="primary" id="save">Save</button></div>
  </form>
</dialog>
<script>
const $=id=>document.getElementById(id); let ar=false,current=null,formats=[]; const api='/client-api/tapes';
const tx={
 en:{title:'Tape Inventory',subtitle:'Physical tape catalog. Digitization is performed outside MAM.',newTape:'+ New tape',refresh:'Refresh',back:'Back to MAM',search:'Search tape code, legacy number, title, location…',loading:'Loading tape inventory…',empty:'No tapes found.',editorNew:'New tape',editorEdit:'Edit tape',save:'Save',cancel:'Cancel',unknown:'Unknown',allocated:'Allocated on save'},
 ar:{title:'فهرس الشرائط',subtitle:'فهرسة الشرائط المادية. تتم عملية التحويل الرقمي خارج نظام MAM.',newTape:'+ شريط جديد',refresh:'تحديث',back:'العودة إلى MAM',search:'بحث بكود الشريط أو الرقم القديم أو العنوان أو الموقع…',loading:'جاري تحميل فهرس الشرائط…',empty:'لا توجد شرائط.',editorNew:'شريط جديد',editorEdit:'تعديل الشريط',save:'حفظ',cancel:'إلغاء',unknown:'غير معروف',allocated:'يتم تخصيصه عند الحفظ'}
};
const labels={hCode:['Tape code','كود الشريط'],hTitle:['Title','العنوان'],hFormat:['Format','النوع'],hLegacy:['Legacy no.','الرقم القديم'],hLocation:['Location','الموقع'],hCondition:['Condition','الحالة'],hStatus:['Digitization','الرقمنة'],hUpdated:['Updated','آخر تعديل'],lCode:['Tape code','كود الشريط'],lLegacy:['Legacy number','الرقم القديم'],lFormat:['Tape format','نوع الشريط'],lTitle:['Title','العنوان'],lCondition:['Physical condition','الحالة المادية'],lDescription:['Description','الوصف'],lOwner:['Owner / department','الجهة / الإدارة'],lDuration:['Duration (seconds)','المدة بالثواني'],lDate:['Recording date','تاريخ التسجيل'],lRoom:['Room','الغرفة'],lCabinet:['Cabinet','الخزانة'],lShelf:['Shelf','الرف'],lBin:['Bin','الصندوق'],lStatus:['Digitization status','حالة الرقمنة'],lNotes:['Notes','ملاحظات']};
function applyLanguage(){const t=ar?tx.ar:tx.en;document.documentElement.lang=ar?'ar':'en';document.documentElement.dir=ar?'rtl':'ltr';$('lang').textContent=ar?'English':'العربية';['title','subtitle','newTape','refresh','back'].forEach(x=>$(x).textContent=t[x]);$('query').placeholder=t.search;$('save').textContent=t.save;$('cancel').textContent=t.cancel;$('tapeCode').placeholder=t.allocated;Object.entries(labels).forEach(([id,v])=>$(id).textContent=v[ar?1:0]);renderFormats();renderRows(lastItems);}
let lastItems=[];
function locationOf(x){return [x.room,x.cabinet,x.shelf,x.bin].filter(Boolean).join(' / ')||'—'}
function fmtDate(x){if(!x)return '—';try{return new Intl.DateTimeFormat(ar?'ar-KW':'en-GB',{dateStyle:'medium',timeStyle:'short'}).format(new Date(x))}catch{return x}}
function renderRows(items){lastItems=items||[];const body=$('rows');body.innerHTML='';if(!lastItems.length){$('tableWrap').hidden=true;$('state').hidden=false;$('state').className='empty';$('state').textContent=ar?tx.ar.empty:tx.en.empty;return}$('state').hidden=true;$('tableWrap').hidden=false;for(const x of lastItems){const tr=document.createElement('tr');tr.dataset.id=x.tapeId;tr.innerHTML=`<td class="code"></td><td></td><td></td><td></td><td></td><td></td><td></td><td class="muted"></td>`;const c=tr.children;c[0].textContent=x.tapeCode;c[1].textContent=x.title||'—';c[2].textContent=x.tapeFormatCode||'—';c[3].textContent=x.legacyNumber||'—';c[4].textContent=locationOf(x);c[5].textContent=x.physicalCondition||'—';const b=document.createElement('span');b.className='badge';b.textContent=x.digitizationStatus;c[6].appendChild(b);c[7].textContent=fmtDate(x.updatedAtUtc);tr.onclick=()=>openEditor(x);body.appendChild(tr)}}
async function json(url,opts){const r=await fetch(url,opts);let payload=null;try{payload=await r.json()}catch{}if(!r.ok){const e=new Error(payload?.detail||payload?.error||`HTTP ${r.status}`);e.status=r.status;e.payload=payload;throw e}return payload}
async function loadFormats(){formats=await json(api+'/formats/list');renderFormats()}
function renderFormats(){const s=$('tapeFormat'),selected=s.value;s.innerHTML=`<option value="">${ar?tx.ar.unknown:tx.en.unknown}</option>`;for(const f of formats){const o=document.createElement('option');o.value=f.code;o.textContent=ar?f.nameAr:f.nameEn;s.appendChild(o)}s.value=selected}
async function load(){const t=ar?tx.ar:tx.en;$('tableWrap').hidden=true;$('state').hidden=false;$('state').className='loading';$('state').textContent=t.loading;try{const q=$('query').value.trim();const page=await json(api+'/?limit=250'+(q?'&query='+encodeURIComponent(q):''));renderRows(page.items)}catch(e){$('state').className='error';$('state').textContent=e.message}}
function val(id){const v=$(id).value.trim();return v===''?null:v} function num(id){const v=$(id).value;return v===''?null:Number(v)}
function openEditor(x){current=x||null;$('editorTitle').textContent=ar?(x?'تعديل الشريط':'شريط جديد'):(x?'Edit tape':'New tape');$('tapeCode').value=x?.tapeCode||'';$('legacyNumber').value=x?.legacyNumber||'';$('tapeTitle').value=x?.title||'';$('description').value=x?.description||'';$('tapeFormat').value=x?.tapeFormatCode||'';$('condition').value=x?.physicalCondition||'';$('ownerDepartment').value=x?.ownerDepartment||'';$('durationSeconds').value=x?.durationSeconds??'';$('recordingDate').value=x?.recordingDate||'';$('room').value=x?.room||'';$('cabinet').value=x?.cabinet||'';$('shelf').value=x?.shelf||'';$('bin').value=x?.bin||'';$('notes').value=x?.notes||'';$('digitizationStatus').value=x?.digitizationStatus||'NotDigitized';$('digitizationStatus').disabled=!x;$('saveStatus').textContent='';$('editor').showModal()}
async function save(){const payload={legacyNumber:val('legacyNumber'),title:val('tapeTitle'),description:val('description'),tapeFormatCode:val('tapeFormat'),physicalCondition:val('condition'),ownerDepartment:val('ownerDepartment'),durationSeconds:num('durationSeconds'),recordingDate:val('recordingDate'),room:val('room'),cabinet:val('cabinet'),shelf:val('shelf'),bin:val('bin'),notes:val('notes')};if(current){payload.digitizationStatus=$('digitizationStatus').value;payload.expectedVersion=current.version}$('save').disabled=true;$('saveStatus').className='status';$('saveStatus').textContent=ar?'جاري الحفظ…':'Saving…';try{const saved=await json(current?`${api}/${current.tapeId}`:api+'/',{method:current?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});$('saveStatus').className='status ok';$('saveStatus').textContent=ar?'تم الحفظ':'Saved';current=saved;setTimeout(()=>{$('editor').close();load()},300)}catch(e){$('saveStatus').className='status bad';$('saveStatus').textContent=e.status===409?(ar?'تم تعديل السجل بواسطة مستخدم آخر. أعد فتحه.':'Another user changed this tape. Reopen it.'):e.message}finally{$('save').disabled=false}}
$('lang').onclick=()=>{ar=!ar;applyLanguage()};$('refresh').onclick=load;$('newTape').onclick=()=>openEditor(null);$('save').onclick=save;let timer;$('query').oninput=()=>{clearTimeout(timer);timer=setTimeout(load,250)};
(async()=>{applyLanguage();try{await loadFormats()}catch(e){console.error(e)}await load()})();
</script>
</body></html>
