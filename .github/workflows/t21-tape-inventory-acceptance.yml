name: T21 Tape Inventory Acceptance

on:
  pull_request:
    paths:
      - 'database/migrations/0014_t2_tape_inventory.sql'
      - 'src/MAM.Api/T2TapeInventoryEndpoints.cs'
      - 'src/MAM.Api/P08Administration.cs'
      - 'src/MAM.Application/Clients/MamTapeInventoryApiClient.cs'
      - 'src/MAM.Application/Tapes/**'
      - 'src/MAM.Domain/Tapes/**'
      - 'src/MAM.Infrastructure/Tapes/**'
      - 'src/MAM.Web/wwwroot/tape-inventory.html'
      - 'src/MAM.Desktop/**T2*'
      - 'tests/MAM.T21.TapeInventoryAcceptance.Checks/**'
      - '.github/workflows/t21-tape-inventory-acceptance.yml'
  push:
    branches: [ main ]
    paths:
      - 'database/migrations/0014_t2_tape_inventory.sql'
      - 'src/MAM.Api/T2TapeInventoryEndpoints.cs'
      - 'src/MAM.Api/P08Administration.cs'
      - 'src/MAM.Application/Clients/MamTapeInventoryApiClient.cs'
      - 'src/MAM.Application/Tapes/**'
      - 'src/MAM.Domain/Tapes/**'
      - 'src/MAM.Infrastructure/Tapes/**'
      - 'src/MAM.Web/wwwroot/tape-inventory.html'
      - 'src/MAM.Desktop/**T2*'
      - 'tests/MAM.T21.TapeInventoryAcceptance.Checks/**'
      - '.github/workflows/t21-tape-inventory-acceptance.yml'

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tests/MAM.T21.TapeInventoryAcceptance.Checks/MAM.T21.TapeInventoryAcceptance.Checks.csproj

      - name: Run Demo SQLite T2.1 acceptance
        run: dotnet run --project tests/MAM.T21.TapeInventoryAcceptance.Checks/MAM.T21.TapeInventoryAcceptance.Checks.csproj --configuration Release --no-restore

      - name: Start ephemeral SQL Server 2022
        shell: bash
        run: |
          set -euo pipefail
          password="MamT21_$(openssl rand -hex 16)_Aa1!"
          echo "::add-mask::$password"
          echo "MAM_T21_SQL_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run --name mam-t21-sql \
            -e ACCEPT_EULA=Y \
            -e MSSQL_SA_PASSWORD="$password" \
            -p 14334:1433 \
            -d mcr.microsoft.com/mssql/server:2022-latest

      - name: Run SQL Server T2.1 persistence and concurrency acceptance
        shell: bash
        run: |
          set -euo pipefail
          password_key="Password"
          master="Server=127.0.0.1,14334;Initial Catalog=master;User ID=sa;${password_key}=${MAM_T21_SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True;Connect Timeout=5"
          dotnet run --project tests/MAM.T21.TapeInventoryAcceptance.Checks/MAM.T21.TapeInventoryAcceptance.Checks.csproj \
            --configuration Release --no-restore -- \
            "$master" MamT21Ci database/migrations

      - name: Verify route composition authorization and bilingual client contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $api = Get-Content src/MAM.Api/T2TapeInventoryEndpoints.cs -Raw
          $composition = Get-Content src/MAM.Api/P08Administration.cs -Raw
          $web = Get-Content src/MAM.Web/wwwroot/tape-inventory.html -Raw
          $desktop = Get-Content src/MAM.Desktop/MainWindow.T21.cs -Raw
          $client = Get-Content src/MAM.Application/Clients/MamTapeInventoryApiClient.cs -Raw

          if ($composition -notmatch 'T2TapeInventoryEndpoints\.Map\(app, configuredApiBasePath\)') {
            throw 'Tape API is not composed into startup.'
          }

          $readPolicies = [regex]::Matches($api, '\.RequireAuthorization\(MamSecurity\.CatalogReadPolicy\);').Count
          $writePolicies = [regex]::Matches($api, '\.RequireAuthorization\(MamSecurity\.CatalogWritePolicy\);').Count
          $adminPolicies = [regex]::Matches($api, '\.RequireAuthorization\(MamSecurity\.AdministrationPolicy\);').Count
          if ($readPolicies -lt 4 -or $writePolicies -lt 2 -or $adminPolicies -lt 1) {
            throw "Tape API authorization contract incomplete. read=$readPolicies write=$writePolicies admin=$adminPolicies"
          }

          foreach ($needle in @(
            '/client-api/tapes',
            'Tape Inventory',
            'فهرس الشرائط',
            'Digitization is performed outside MAM',
            'تتم عملية التحويل الرقمي خارج نظام MAM',
            'Another user changed this tape',
            'تم تعديل السجل بواسطة مستخدم آخر'
          )) {
            if (-not $web.Contains($needle)) { throw "Missing Web acceptance marker: $needle" }
          }

          foreach ($needle in @(
            'Tape Inventory',
            'فهرس الشرائط',
            'Digitization is performed outside MAM',
            'تتم عملية التحويل الرقمي خارج نظام MAM',
            'Permission denied for tape creation',
            'لا توجد صلاحية لإنشاء سجلات الشرائط'
          )) {
            if (-not $desktop.Contains($needle)) { throw "Missing Desktop acceptance marker: $needle" }
          }

          if ($web -match 'SqlConnection|ConnectionString|Microsoft\.Data\.SqlClient' -or
              $desktop -match 'SqlConnection|ConnectionString|Microsoft\.Data\.SqlClient' -or
              $client -match 'SqlConnection|Microsoft\.Data\.SqlClient') {
            throw 'Client tape inventory surfaces must remain Central-API-only.'
          }

          Write-Host 'T2.1 API AUTHORIZATION + BILINGUAL CLIENT CONTRACT: PASS'

      - name: Stop ephemeral SQL Server
        if: always()
        shell: bash
        run: docker rm -f mam-t21-sql >/dev/null 2>&1 || true
