name: Management Pages Acceptance

on:
  pull_request:
    paths:
      - 'database/migrations/0016_taxonomy_collections_tags_management.sql'
      - 'database/migrations/0019_navigation_state_reconciliation.sql'
      - 'database/migrations/0020_release_capabilities_navigation.sql'
      - 'database/migrations/0022_role_permission_matrix.sql'
      - 'src/MAM.Api/P1214NavigationEndpoints.cs'
      - 'src/MAM.Api/P08Administration.cs'
      - 'src/MAM.Api/P142OwnerClosureEndpoints.cs'
      - 'src/MAM.Api/Security/MamAuthenticationHandler.cs'
      - 'src/MAM.Application/Administration/**'
      - 'src/MAM.Application/Clients/MamAdministrationApiClient.cs'
      - 'src/MAM.Infrastructure/Administration/**'
      - 'src/MAM.Web/P08AdministrationProxy.cs'
      - 'src/MAM.Web/wwwroot/p1214-navigation-management.js'
      - 'src/MAM.Web/wwwroot/p141-api-resilience.js'
      - 'src/MAM.Api/Program.cs'
      - 'src/MAM.Application/Curation/**'
      - 'src/MAM.Application/Clients/MamCurationApiClient.cs'
      - 'src/MAM.Infrastructure/Curation/**'
      - 'src/MAM.Infrastructure/Discovery/**'
      - 'src/MAM.Infrastructure/Demo/DemoCurationService.cs'
      - 'src/MAM.Infrastructure/Demo/DemoDiscoveryService.cs'
      - 'src/MAM.Infrastructure/Demo/DemoSqliteDatabase.cs'
      - 'src/MAM.Desktop/MainWindow.Management.cs'
      - 'src/MAM.Desktop/MainWindow.P12.cs'
      - 'src/MAM.Desktop/MainWindow.P05.cs'
      - 'src/MAM.Web/wwwroot/p138-taxonomy-management.js'
      - 'src/MAM.Web/wwwroot/p05-curation.js'
      - 'src/MAM.Web/wwwroot/p03-upload.js'
      - 'src/MAM.Web/wwwroot/p127-enterprise-v2.js'
      - 'src/MAM.Web/wwwroot/p08-administration.js'
      - 'src/MAM.Web/wwwroot/p12-discovery.js'
      - 'src/MAM.Web/wwwroot/p142-owner-closure.js'
      - 'src/MAM.Web/wwwroot/p132-navigation-final.js'
      - 'src/MAM.Web/wwwroot/index.html'
      - 'tests/MAM.Management.Acceptance.Checks/**'
      - '.github/workflows/management-pages-acceptance.yml'
  push:
    branches: [ main ]
    paths:
      - 'database/migrations/0016_taxonomy_collections_tags_management.sql'
      - 'database/migrations/0019_navigation_state_reconciliation.sql'
      - 'database/migrations/0020_release_capabilities_navigation.sql'
      - 'database/migrations/0022_role_permission_matrix.sql'
      - 'src/MAM.Api/P1214NavigationEndpoints.cs'
      - 'src/MAM.Api/P08Administration.cs'
      - 'src/MAM.Api/P142OwnerClosureEndpoints.cs'
      - 'src/MAM.Api/Security/MamAuthenticationHandler.cs'
      - 'src/MAM.Application/Administration/**'
      - 'src/MAM.Application/Clients/MamAdministrationApiClient.cs'
      - 'src/MAM.Infrastructure/Administration/**'
      - 'src/MAM.Web/P08AdministrationProxy.cs'
      - 'src/MAM.Web/wwwroot/p1214-navigation-management.js'
      - 'src/MAM.Web/wwwroot/p141-api-resilience.js'
      - 'src/MAM.Api/Program.cs'
      - 'src/MAM.Application/Curation/**'
      - 'src/MAM.Application/Clients/MamCurationApiClient.cs'
      - 'src/MAM.Infrastructure/Curation/**'
      - 'src/MAM.Infrastructure/Discovery/**'
      - 'src/MAM.Infrastructure/Demo/DemoCurationService.cs'
      - 'src/MAM.Infrastructure/Demo/DemoDiscoveryService.cs'
      - 'src/MAM.Infrastructure/Demo/DemoSqliteDatabase.cs'
      - 'src/MAM.Desktop/MainWindow.Management.cs'
      - 'src/MAM.Desktop/MainWindow.P12.cs'
      - 'src/MAM.Desktop/MainWindow.P05.cs'
      - 'src/MAM.Web/wwwroot/p138-taxonomy-management.js'
      - 'src/MAM.Web/wwwroot/p05-curation.js'
      - 'src/MAM.Web/wwwroot/p03-upload.js'
      - 'src/MAM.Web/wwwroot/p127-enterprise-v2.js'
      - 'src/MAM.Web/wwwroot/p08-administration.js'
      - 'src/MAM.Web/wwwroot/p12-discovery.js'
      - 'src/MAM.Web/wwwroot/p142-owner-closure.js'
      - 'src/MAM.Web/wwwroot/p132-navigation-final.js'
      - 'src/MAM.Web/wwwroot/index.html'
      - 'tests/MAM.Management.Acceptance.Checks/**'
      - '.github/workflows/management-pages-acceptance.yml'

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore tests/MAM.Management.Acceptance.Checks/MAM.Management.Acceptance.Checks.csproj
      - name: Run Demo SQLite management acceptance
        run: dotnet run --project tests/MAM.Management.Acceptance.Checks/MAM.Management.Acceptance.Checks.csproj --configuration Release --no-restore
      - name: Verify Web management JavaScript syntax
        run: node --check src/MAM.Web/wwwroot/p138-taxonomy-management.js
      - name: Verify curation and upload JavaScript syntax
        run: |
          node --check src/MAM.Web/wwwroot/p05-curation.js
          node --check src/MAM.Web/wwwroot/p03-upload.js
          node --check src/MAM.Web/wwwroot/p1214-navigation-management.js
          node --check src/MAM.Web/wwwroot/p141-api-resilience.js
          node --check src/MAM.Web/wwwroot/p08-administration.js
          node --check src/MAM.Web/wwwroot/p12-discovery.js
          node --check src/MAM.Web/wwwroot/p132-navigation-final.js
          node --check src/MAM.Web/wwwroot/p142-owner-closure.js
          node --check src/MAM.Web/wwwroot/p03-upload.js
          node --check src/MAM.Web/wwwroot/p05-curation.js
          node --check src/MAM.Web/wwwroot/p12-function-actions.js
          node --check src/MAM.Web/wwwroot/p140-media-library-owner.js
      - name: Verify navigation reconciliation invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q "systemFunctions" database/migrations/0019_navigation_state_reconciliation.sql
          grep -q "Deliberately do not overwrite" database/migrations/0019_navigation_state_reconciliation.sql
          grep -q "MERGE dbo.MamNavigationItem" src/MAM.Api/P1214NavigationEndpoints.cs
          grep -q "WHEN NOT MATCHED THEN" src/MAM.Api/P1214NavigationEndpoints.cs
          grep -q "mam.navigation.lastKnownGood.v1" src/MAM.Web/wwwroot/p1214-navigation-management.js
          grep -q "function routeElements" src/MAM.Web/wwwroot/p1214-navigation-management.js
          grep -q "element.hidden = !enabled" src/MAM.Web/wwwroot/p1214-navigation-management.js
          grep -q "capabilities" database/migrations/0020_release_capabilities_navigation.sql
          grep -q "navigationKey:'capabilities'" src/MAM.Web/wwwroot/p1214-navigation-management.js
          grep -q 'MapDelete("/users/{userId:guid}"' src/MAM.Api/P08Administration.cs
          grep -q 'MapDelete("/client-api/admin/users/{userId:guid}"' src/MAM.Web/P08AdministrationProxy.cs
          grep -q "DeleteUserAsync" src/MAM.Application/Clients/MamAdministrationApiClient.cs
          grep -q "MamRolePermission" database/migrations/0022_role_permission_matrix.sql
          grep -q "tape.delete" database/migrations/0022_role_permission_matrix.sql
          grep -q "data-admin-tab" src/MAM.Web/wwwroot/p08-administration.js
          ! grep -q "data-p142-admin-tab" src/MAM.Web/wwwroot/p142-owner-closure.js
          grep -q "loadAdminTab:renderCustomTab" src/MAM.Web/wwwroot/p142-owner-closure.js
          grep -q "ReadRolePermissionsAsync" src/MAM.Api/Security/MamAuthenticationHandler.cs
          grep -q "DeletedUserNamePrefix" src/MAM.Infrastructure/Administration/SqlServerAdministrationService.cs
          grep -q "data-p12-curation-tab=\"bulk\"" src/MAM.Web/wwwroot/p12-function-actions.js
          grep -q "id=\"p12BulkCategory\"" src/MAM.Web/wwwroot/p12-function-actions.js
          grep -q "id=\"p12BulkTags\" multiple" src/MAM.Web/wwwroot/p12-function-actions.js
          grep -q "p143UploadErrorModal" src/MAM.Web/wwwroot/p03-upload.js
          ! grep -q "Resume available" src/MAM.Web/wwwroot/p03-upload.js
          ! grep -q "p128-library-hero" src/MAM.Web/wwwroot/p140-media-library-owner.js
          grep -q "if (renderInFlight) return" src/MAM.Web/wwwroot/p140-media-library-owner.js
          grep -q 'data-p140-final="1" data-p142-popup="1"' src/MAM.Web/wwwroot/p140-media-library-owner.js
          grep -q "consecutiveFailures < 3" src/MAM.Web/wwwroot/p140-media-library-owner.js
          grep -Fq '[data-p140-final="1"],.state.loading' src/MAM.Web/wwwroot/p134-final-library-owner.js
          ! grep -Fq '.mam-library-tabs,.p128-library-hero,.state.loading' src/MAM.Web/wwwroot/p134-final-library-owner.js
          grep -Fq "window.mamAuthoritativeMediaLibrary?.render" src/MAM.Web/wwwroot/p128-reference-ui.js
          grep -q "method !== 'GET'" src/MAM.Web/wwwroot/p141-api-resilience.js
          grep -q "350" src/MAM.Web/wwwroot/p141-api-resilience.js
      - name: Start ephemeral SQL Server 2022
        shell: bash
        run: |
          set -euo pipefail
          password="MamManagement_$(openssl rand -hex 16)_Aa1!"
          echo "::add-mask::$password"
          echo "MAM_MANAGEMENT_SQL_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run --name mam-management-sql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$password" -p 14335:1433 -d mcr.microsoft.com/mssql/server:2022-latest
      - name: Run SQL Server management persistence acceptance
        shell: bash
        run: |
          set -euo pipefail
          password_key="Password"
          master="Server=127.0.0.1,14335;Initial Catalog=master;User ID=sa;${password_key}=${MAM_MANAGEMENT_SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True;Connect Timeout=5"
          dotnet run --project tests/MAM.Management.Acceptance.Checks/MAM.Management.Acceptance.Checks.csproj --configuration Release --no-restore -- "$master" MamManagementCi database/migrations
      - name: Stop ephemeral SQL Server
        if: always()
        shell: bash
        run: docker rm -f mam-management-sql >/dev/null 2>&1 || true
