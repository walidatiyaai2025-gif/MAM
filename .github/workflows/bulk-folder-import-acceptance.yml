name: Bulk Folder Import Acceptance

on:
  pull_request:
    paths:
      - 'database/migrations/0015_bulk_folder_import.sql'
      - 'src/MAM.Api/BulkImportEndpoints.cs'
      - 'src/MAM.Api/P12AssetDeletionEndpoints.cs'
      - 'src/MAM.Api/Program.cs'
      - 'src/MAM.Application/BulkImport/**'
      - 'src/MAM.Application/Processing/ProcessingContracts.cs'
      - 'src/MAM.Application/Clients/MamBulkImportApiClient.cs'
      - 'src/MAM.Infrastructure/BulkImport/**'
      - 'src/MAM.Infrastructure/Demo/DemoSqliteDatabase.cs'
      - 'src/MAM.Infrastructure/Demo/DemoUploadProcessingProtection.cs'
      - 'src/MAM.Infrastructure/Discovery/SqlServerDiscoveryService.cs'
      - 'src/MAM.Infrastructure/Demo/DemoDiscoveryService.cs'
      - 'src/MAM.Desktop/MainWindow.BulkImport.cs'
      - 'src/MAM.Desktop/MainWindow.P03.cs'
      - 'src/MAM.Web/wwwroot/p137-bulk-folder-import.js'
      - 'src/MAM.Web/wwwroot/p03-upload.js'
      - 'src/MAM.Web/wwwroot/index.html'
      - 'tests/MAM.BulkImport.Acceptance.Checks/**'
      - '.github/workflows/bulk-folder-import-acceptance.yml'
  push:
    branches: [ main ]
    paths:
      - 'database/migrations/0015_bulk_folder_import.sql'
      - 'src/MAM.Api/BulkImportEndpoints.cs'
      - 'src/MAM.Api/Program.cs'
      - 'src/MAM.Application/BulkImport/**'
      - 'src/MAM.Application/Processing/ProcessingContracts.cs'
      - 'src/MAM.Application/Clients/MamBulkImportApiClient.cs'
      - 'src/MAM.Infrastructure/BulkImport/**'
      - 'src/MAM.Infrastructure/Demo/DemoSqliteDatabase.cs'
      - 'src/MAM.Infrastructure/Demo/DemoUploadProcessingProtection.cs'
      - 'src/MAM.Infrastructure/Discovery/SqlServerDiscoveryService.cs'
      - 'src/MAM.Infrastructure/Demo/DemoDiscoveryService.cs'
      - 'src/MAM.Desktop/MainWindow.BulkImport.cs'
      - 'src/MAM.Desktop/MainWindow.P03.cs'
      - 'src/MAM.Web/wwwroot/p137-bulk-folder-import.js'
      - 'src/MAM.Web/wwwroot/p03-upload.js'
      - 'src/MAM.Web/wwwroot/index.html'
      - 'tests/MAM.BulkImport.Acceptance.Checks/**'
      - '.github/workflows/bulk-folder-import-acceptance.yml'

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tests/MAM.BulkImport.Acceptance.Checks/MAM.BulkImport.Acceptance.Checks.csproj

      - name: Run durable Demo bulk-import acceptance
        run: dotnet run --project tests/MAM.BulkImport.Acceptance.Checks/MAM.BulkImport.Acceptance.Checks.csproj --configuration Release --no-restore

      - name: Verify permanent deletion detaches retained bulk-import history
        shell: pwsh
        run: |
          $delete = Get-Content src/MAM.Api/P12AssetDeletionEndpoints.cs -Raw
          $detach = $delete.IndexOf('UPDATE bulkItem')
          $uploadDelete = $delete.IndexOf('DELETE dbo.MamUploadSession WHERE AssetId=@AssetId;')
          $assetDelete = $delete.IndexOf('DELETE dbo.MediaAsset WHERE AssetId=@AssetId;')
          if ($detach -lt 0) { throw 'Permanent deletion does not detach MamBulkImportItem references.' }
          if ($uploadDelete -lt 0 -or $assetDelete -lt 0) { throw 'Permanent deletion SQL markers are missing.' }
          if (-not ($detach -lt $uploadDelete -and $uploadDelete -lt $assetDelete)) {
            throw 'Bulk-import references must be detached before upload-session and asset deletion.'
          }
          foreach ($marker in @('UploadSessionId=NULL','AssetId=NULL','bulkItem.AssetId=@AssetId','uploadSession.AssetId=@AssetId')) {
            if (-not $delete.Contains($marker)) { throw "Missing bulk-import delete-safety marker: $marker" }
          }

      - name: Verify Web JavaScript syntax
        run: |
          node --check src/MAM.Web/wwwroot/p137-bulk-folder-import.js
          node --check src/MAM.Web/wwwroot/p03-upload.js

      - name: Verify adjacent upload tabs and category selector
        shell: pwsh
        run: |
          $bulk = Get-Content src/MAM.Web/wwwroot/p137-bulk-folder-import.js -Raw
          $single = Get-Content src/MAM.Web/wwwroot/p03-upload.js -Raw
          $desktopSingle = Get-Content src/MAM.Desktop/MainWindow.P03.cs -Raw
          $desktopBulk = Get-Content src/MAM.Desktop/MainWindow.BulkImport.cs -Raw
          foreach ($marker in @('p140-upload-tabs','p140SingleTab','p140FolderTab','Add one media','Add complete folder')) {
            if (-not $bulk.Contains($marker)) { throw "Missing Web upload tab marker: $marker" }
          }
          if (-not $single.Contains('<select id="p132Category"') -or $single.Contains('<input id="p132Category"')) {
            throw 'Single-media category must be a dropdown.'
          }
          foreach ($marker in @('Add one media','Add complete folder')) {
            if (-not $desktopSingle.Contains($marker) -or -not $desktopBulk.Contains($marker)) {
              throw "Missing Desktop upload tab marker: $marker"
            }
          }

          $profiles = Get-Content src/MAM.Application/Processing/ProcessingContracts.cs -Raw
          $coordinator = Get-Content src/MAM.Infrastructure/BulkImport/BulkImportCoordinator.cs -Raw
          foreach ($marker in @('AutomaticForUpload','ImagePreview','VideoProxy','AudioPreview')) {
            if (-not $profiles.Contains($marker)) { throw "Missing automatic preview profile marker: $marker" }
          }
          if (-not $coordinator.Contains('BuiltInProcessingProfiles.AutomaticForUpload')) {
            throw 'Folder import must use the shared automatic preview/thumbnail profile selector.'
          }
