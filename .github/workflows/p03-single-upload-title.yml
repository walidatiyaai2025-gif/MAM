name: P03 Single Upload Title Regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload-title:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Web and enterprise syntax
        run: |
          node --check src/MAM.Web/wwwroot/p03-upload.js
          node --check src/MAM.Web/wwwroot/p127-enterprise.js
      - name: Sequential uploads title regression
        run: node eng/p03-single-upload-title-acceptance.cjs
