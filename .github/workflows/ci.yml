name: ci

on:
  push:
    branches:
      - main
      - 'worker/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-security:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MAM.sln

      - name: Build
        run: dotnet build MAM.sln --configuration Release --no-restore -p:SourceRevisionId=${{ github.sha }}

      - name: Foundation acceptance checks
        run: dotnet run --project tests/MAM.Foundation.Checks/MAM.Foundation.Checks.csproj --configuration Release --no-build -- config/appsettings.Development.template.json config/appsettings.Production.template.json

      - name: Repository secret baseline
        shell: pwsh
        run: ./eng/verify-repo.ps1

      - name: Dependency vulnerability baseline
        run: dotnet list MAM.sln package --vulnerable --include-transitive
