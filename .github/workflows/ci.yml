name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MAM.sln -p:EnableWindowsTargeting=true

      - name: Stamp build metadata
        shell: bash
        run: |
          echo "MamBuildNumber=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "MamBuildTimestampUtc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build MAM.sln --configuration Release --no-restore -p:EnableWindowsTargeting=true -p:SourceRevisionId=${{ github.sha }}

      - name: Foundation acceptance checks
        run: dotnet run --project tests/MAM.Foundation.Checks/MAM.Foundation.Checks.csproj --configuration Release --no-build -- config/appsettings.Development.template.json config/appsettings.Production.template.json

      - name: P01 UI contract acceptance checks
        run: dotnet run --project tests/MAM.P01.UiAcceptance.Checks/MAM.P01.UiAcceptance.Checks.csproj --configuration Release

      - name: Repository secret baseline
        shell: pwsh
        run: ./eng/verify-repo.ps1

      - name: Dependency vulnerability baseline
        run: dotnet list MAM.sln package --vulnerable --include-transitive

  p01-rendered-visual-acceptance:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore MAM.sln -p:EnableWindowsTargeting=true
          dotnet restore tests/MAM.P01.VisualAcceptance.Checks/MAM.P01.VisualAcceptance.Checks.csproj

      - name: Build
        shell: pwsh
        run: dotnet build MAM.sln --configuration Release --no-restore -p:EnableWindowsTargeting=true -p:SourceRevisionId=${{ github.sha }}

      - name: Render Windows Desktop acceptance evidence
        shell: pwsh
        run: dotnet run --project tests/MAM.P01.VisualAcceptance.Checks/MAM.P01.VisualAcceptance.Checks.csproj --configuration Release -- artifacts/p01-visual

      - name: Render Web acceptance evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $PWD 'artifacts/p01-visual'
          New-Item -ItemType Directory -Force -Path $output | Out-Null

          $web = Start-Process dotnet -ArgumentList @('run','--project','src/MAM.Web/MAM.Web.csproj','--configuration','Release','--no-build','--urls','http://127.0.0.1:5080') -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:5080/version' -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ready) { throw 'MAM.Web did not become ready for rendered acceptance.' }

            $edgeCandidates = @(
              "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
              "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
            )
            $edge = $edgeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $edge) { throw 'Microsoft Edge executable was not found on the Windows runner.' }

            $captures = @(
              @{ Name='web-360-en.png'; Width=360; Height=900; Url='http://127.0.0.1:5080/' },
              @{ Name='web-360-ar.png'; Width=360; Height=900; Url='http://127.0.0.1:5080/?lang=ar' },
              @{ Name='web-820-en.png'; Width=820; Height=1000; Url='http://127.0.0.1:5080/' },
              @{ Name='web-820-ar.png'; Width=820; Height=1000; Url='http://127.0.0.1:5080/?lang=ar' },
              @{ Name='web-1440-en.png'; Width=1440; Height=1000; Url='http://127.0.0.1:5080/' },
              @{ Name='web-1440-ar.png'; Width=1440; Height=1000; Url='http://127.0.0.1:5080/?lang=ar' }
            )

            foreach ($capture in $captures) {
              $path = Join-Path $output $capture.Name
              & $edge '--headless' '--disable-gpu' '--hide-scrollbars' '--run-all-compositor-stages-before-draw' '--virtual-time-budget=3000' "--window-size=$($capture.Width),$($capture.Height)" "--screenshot=$path" $capture.Url
              if ($LASTEXITCODE -ne 0) { throw "Edge screenshot failed for $($capture.Name)." }
              if (-not (Test-Path $path) -or (Get-Item $path).Length -lt 10000) { throw "Rendered Web evidence is missing or trivial: $($capture.Name)." }
            }
          }
          finally {
            if ($web -and -not $web.HasExited) { Stop-Process -Id $web.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload P01 rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-rendered-visual-evidence
          path: artifacts/p01-visual/*.png
          if-no-files-found: error
