name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: |
          dotnet restore MAM.sln -p:EnableWindowsTargeting=true
          dotnet restore tests/MAM.P02.SqlAcceptance.Checks/MAM.P02.SqlAcceptance.Checks.csproj
          dotnet restore tests/MAM.P02.ClientAcceptance.Checks/MAM.P02.ClientAcceptance.Checks.csproj

      - name: Stamp build metadata
        shell: bash
        run: |
          echo "MamBuildNumber=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "MamBuildTimestampUtc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Build
        run: |
          dotnet build MAM.sln --configuration Release --no-restore -p:EnableWindowsTargeting=true -p:SourceRevisionId=${{ github.sha }}
          dotnet build tests/MAM.P02.SqlAcceptance.Checks/MAM.P02.SqlAcceptance.Checks.csproj --configuration Release --no-restore
          dotnet build tests/MAM.P02.ClientAcceptance.Checks/MAM.P02.ClientAcceptance.Checks.csproj --configuration Release --no-restore

      - name: Foundation acceptance checks
        run: dotnet run --project tests/MAM.Foundation.Checks/MAM.Foundation.Checks.csproj --configuration Release --no-build -- config/appsettings.Development.template.json config/appsettings.Production.template.json

      - name: P01 UI contract acceptance checks
        run: dotnet run --project tests/MAM.P01.UiAcceptance.Checks/MAM.P01.UiAcceptance.Checks.csproj --configuration Release

      - name: P02 Central API development authorization acceptance
        run: bash eng/p02-api-acceptance.sh

      - name: Start ephemeral SQL Server 2022
        shell: bash
        run: |
          set -euo pipefail
          password="MamP02_$(openssl rand -hex 16)_Aa1!"
          echo "::add-mask::$password"
          echo "MAM_SQL_TEST_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run --name mam-p02-sql \
            -e ACCEPT_EULA=Y \
            -e MSSQL_SA_PASSWORD="$password" \
            -p 14333:1433 \
            -d mcr.microsoft.com/mssql/server:2022-latest

      - name: P02 clean SQL migration and catalog acceptance
        shell: bash
        run: |
          set -euo pipefail
          password_key="Password"
          master="Server=127.0.0.1,14333;Initial Catalog=master;User ID=sa;${password_key}=${MAM_SQL_TEST_PASSWORD};Encrypt=True;TrustServerCertificate=True;Connect Timeout=5"
          dotnet run --project tests/MAM.P02.SqlAcceptance.Checks/MAM.P02.SqlAcceptance.Checks.csproj --configuration Release --no-build -- "$master" MamP02Ci database/migrations

      - name: P02 SQL-backed Central API two-client acceptance
        shell: bash
        run: bash eng/p02-sql-api-acceptance.sh

      - name: P02 client database-boundary acceptance
        shell: bash
        run: bash eng/p02-client-boundary-acceptance.sh

      - name: P03 durable Primary upload acceptance
        shell: bash
        run: bash eng/p03-upload-acceptance.sh

      - name: P03 client Primary Storage boundary acceptance
        shell: bash
        run: bash eng/p03-client-storage-boundary-acceptance.sh

      - name: Install P04 FFmpeg and FFprobe tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: P04 media processing acceptance
        shell: bash
        env:
          MAM_STORAGE_BASE_PATH: ${{ github.workspace }}
        run: bash eng/p04-processing-acceptance.sh

      - name: P04 failure-only worker diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          log_dir="${RUNNER_TEMP}/mam-p04"
          if [[ -d "$log_dir" ]]; then
            for log in "$log_dir"/worker-*.log; do
              [[ -e "$log" ]] || continue
              echo "::group::$(basename "$log")"
              sed -E 's/(Password=)[^;]+/\1***MASKED***/g' "$log"
              echo "::endgroup::"
            done
          fi

      - name: P04 client and worker boundary acceptance
        shell: bash
        run: bash eng/p04-client-worker-boundary-acceptance.sh

      - name: P05 search and metadata curation acceptance
        shell: bash
        run: bash eng/p05-curation-acceptance.sh

      - name: P05 client Central API boundary acceptance
        shell: bash
        run: bash eng/p05-client-boundary-acceptance.sh

      - name: P06 Backup Storage protection acceptance
        shell: bash
        env:
          MAM_STORAGE_BASE_PATH: ${{ github.workspace }}
        run: bash eng/p06-protection-acceptance.sh

      - name: P06 client storage/security boundary acceptance
        shell: bash
        run: bash eng/p06-client-boundary-acceptance.sh

      - name: P06 failure-only worker diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          log_dir="${RUNNER_TEMP}/mam-p06"
          if [[ -d "$log_dir" ]]; then
            for log in "$log_dir"/*.log; do
              [[ -e "$log" ]] || continue
              echo "::group::$(basename "$log")"
              sed -E 's/(Password=)[^;]+/\1***MASKED***/g' "$log"
              echo "::endgroup::"
            done
          fi

      - name: Repository secret baseline
        shell: pwsh
        run: ./eng/verify-repo.ps1

      - name: Dependency vulnerability baseline
        run: dotnet list MAM.sln package --vulnerable --include-transitive

      - name: Stop ephemeral SQL Server
        if: always()
        shell: bash
        run: docker rm -f mam-p02-sql >/dev/null 2>&1 || true

  p01-rendered-visual-acceptance:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore MAM.sln -p:EnableWindowsTargeting=true
          dotnet restore tests/MAM.P01.VisualAcceptance.Checks/MAM.P01.VisualAcceptance.Checks.csproj
          dotnet restore tests/MAM.P01.WebVisualAcceptance.Checks/MAM.P01.WebVisualAcceptance.Checks.csproj

      - name: Build
        shell: pwsh
        run: dotnet build MAM.sln --configuration Release --no-restore -p:EnableWindowsTargeting=true -p:SourceRevisionId=${{ github.sha }}

      - name: Render Windows Desktop acceptance evidence
        shell: pwsh
        run: dotnet run --project tests/MAM.P01.VisualAcceptance.Checks/MAM.P01.VisualAcceptance.Checks.csproj --configuration Release -- artifacts/p01-visual

      - name: Render Web acceptance evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $PWD 'artifacts/p01-visual'
          New-Item -ItemType Directory -Force -Path $output | Out-Null

          $web = Start-Process dotnet -ArgumentList @('run','--project','src/MAM.Web/MAM.Web.csproj','--configuration','Release','--no-build','--urls','http://127.0.0.1:5080') -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:5080/version' -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ready) { throw 'MAM.Web did not become ready for rendered acceptance.' }

            dotnet run --project tests/MAM.P01.WebVisualAcceptance.Checks/MAM.P01.WebVisualAcceptance.Checks.csproj --configuration Release -- $output 'http://127.0.0.1:5080'
            if ($LASTEXITCODE -ne 0) { throw "P01 Web visual acceptance failed with exit code $LASTEXITCODE." }
          }
          finally {
            if ($web -and -not $web.HasExited) { Stop-Process -Id $web.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload P01 rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-rendered-visual-evidence
          path: artifacts/p01-visual/*.png
          if-no-files-found: error