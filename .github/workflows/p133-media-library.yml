name: P133 Media Library Date Category Acceptance

on:
  pull_request:
  push:
    branches:
      - main
      - worker/media-library-date-category-trees
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media-library-date-category-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore and build
        run: |
          dotnet restore MAM.sln
          dotnet build MAM.sln --configuration Release --no-restore
      - name: Offline Demo media organization acceptance
        run: dotnet run --project tests/MAM.P133.MediaLibraryAcceptance.Checks/MAM.P133.MediaLibraryAcceptance.Checks.csproj --configuration Release
      - name: Media Library UI syntax and contract acceptance
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n1)
          test -n "$version"
          node --check src/MAM.Web/wwwroot/p133-media-library.js
          node --check src/MAM.Web/wwwroot/p128-reference-ui.js
          node --check src/MAM.Web/wwwroot/p128-media-previews.js
          node --check src/MAM.Web/wwwroot/p140-media-library-owner.js
          grep -q 'p133-media-library.css' src/MAM.Web/wwwroot/index.html
          grep -q 'p133-media-library.js' src/MAM.Web/wwwroot/index.html
          grep -q "'/client-api/media-library/snapshot'" src/MAM.Web/wwwroot/p133-media-library.js
          grep -q '/organization' src/MAM.Web/wwwroot/p133-media-library.js
          grep -q 'contextmenu' src/MAM.Web/wwwroot/p133-media-library.js
          grep -q 'dragstart' src/MAM.Web/wwwroot/p133-media-library.js
          grep -q 'By Upload Date' src/MAM.Web/wwwroot/p133-media-library.js
          grep -q 'By Production Date' src/MAM.Web/wwwroot/p133-media-library.js
          grep -q 'By Category' src/MAM.Web/wwwroot/p133-media-library.js
          grep -q 'بدون تاريخ إنتاج' src/MAM.Web/wwwroot/p133-media-library.js
          grep -q 'تغيير التصنيف' src/MAM.Web/wwwroot/p133-media-library.js
          grep -q 'تاريخ الرفع' src/MAM.Web/wwwroot/p133-media-library.js
          grep -q 'Actual Production Date' src/MAM.Web/wwwroot/p133-media-library.js
          grep -q 'response.status===409' src/MAM.Web/wwwroot/p133-media-library.js
          grep -q 'authoritative reread' src/MAM.Web/wwwroot/p133-media-library.js
          grep -q 'p140-media-library-owner.js?v=' src/MAM.Web/wwwroot/index.html
          grep -q 'const PAGE_SIZE = 24' src/MAM.Web/wwwroot/p140-media-library-owner.js
          grep -q 'includeFacets: String(includeFacets)' src/MAM.Web/wwwroot/p140-media-library-owner.js
          grep -q 'عرض ${start}–${end} من إجمالي ${total}' src/MAM.Web/wwwroot/p140-media-library-owner.js
          grep -q "version:'p140-library-owner-3'" src/MAM.Web/wwwroot/p140-media-library-owner.js
          grep -q 'if (renderInFlight) return' src/MAM.Web/wwwroot/p140-media-library-owner.js
          grep -q 'data-p140-final="1" data-p142-popup="1"' src/MAM.Web/wwwroot/p140-media-library-owner.js
          grep -q 'consecutiveFailures < 3' src/MAM.Web/wwwroot/p140-media-library-owner.js
          grep -q "const OWNER = 'p140-authoritative-pagination'" src/MAM.Web/wwwroot/p140-media-library-owner.js
          grep -q 'ensureCanonicalHost' src/MAM.Web/wwwroot/p140-media-library-owner.js
          grep -q 'scheduleOwnerRepair' src/MAM.Web/wwwroot/p140-media-library-owner.js
          grep -Fq '[data-p140-final="1"],.state.loading' src/MAM.Web/wwwroot/p134-final-library-owner.js
          ! grep -Fq '.mam-library-tabs,.p128-library-hero,.state.loading' src/MAM.Web/wwwroot/p134-final-library-owner.js
          grep -Fq "if(route==='library'&&window.mamAuthoritativeMediaLibrary?.render)" src/MAM.Web/wwwroot/p128-reference-ui.js
          grep -q 'mam-library-tabs' src/MAM.Web/wwwroot/p135-unified-experience.js
          grep -q 'libraryTab' src/MAM.Web/wwwroot/p135-unified-experience.js
          if grep -q 'MamMediaLibraryTrees.reload' src/MAM.Web/wwwroot/p134-final-library-owner.js; then
            echo 'P134 must never call the legacy P133 Media Library renderer.' >&2
            exit 1
          fi
          grep -q 'id="p140SelectAllCurrent"' src/MAM.Web/wwwroot/p140-media-library-owner.js
          grep -q 'id="p140DeleteSelected"' src/MAM.Web/wwwroot/p140-media-library-owner.js
          grep -q 'confirmDeleteAssets' src/MAM.Web/wwwroot/p140-media-library-owner.js
          grep -q 'data-mam-open-asset' src/MAM.Web/wwwroot/p140-media-library-owner.js
          grep -q 'data-p05-edit' src/MAM.Web/wwwroot/p140-media-library-owner.js
          grep -q 'data-mam-delete-asset' src/MAM.Web/wwwroot/p140-media-library-owner.js
          grep -q '/client-api/admin/assets/' src/MAM.Web/wwwroot/p140-media-library-owner.js
          grep -q '/client-api/discovery/dashboard/uploaders' src/MAM.Web/wwwroot/p128-reference-ui.js
          grep -q "item.displayName||''" src/MAM.Web/wwwroot/p128-reference-ui.js
          grep -q "item.userName||''" src/MAM.Web/wwwroot/p128-reference-ui.js
          grep -q 'upload.session.finalized' src/MAM.Api/P12UxEndpoints.cs
          grep -q 'upload.primary.committed' src/MAM.Api/P12UxEndpoints.cs
          grep -q 'INNER JOIN dbo.MediaAsset asset ON asset.AssetId=ranked.AssetId' src/MAM.Api/P12UxEndpoints.cs
          grep -q 'ROW_NUMBER() OVER' src/MAM.Api/P12UxEndpoints.cs
          grep -q 'resolved.DisplayName' src/MAM.Api/P12UxEndpoints.cs
          grep -q 'resolved.UserName' src/MAM.Api/P12UxEndpoints.cs
          grep -q 'MAX_PREVIEW_CONCURRENCY=4' src/MAM.Web/wwwroot/p128-media-previews.js
          grep -q 'IntersectionObserver' src/MAM.Web/wwwroot/p128-media-previews.js
          p132_line=$(grep -n 'p132-navigation-final.js' src/MAM.Web/wwwroot/index.html | head -1 | cut -d: -f1)
          p140_line=$(grep -n 'p140-media-library-owner.js' src/MAM.Web/wwwroot/index.html | head -1 | cut -d: -f1)
          test "$p140_line" -gt "$p132_line" || { echo 'P140 Media Library owner must load after P132 final navigation owner.' >&2; exit 1; }
      - name: Cookie-first session and explicit Windows SSO contract
        shell: bash
        run: |
          set -euo pipefail
          program=src/MAM.Web/Program.cs
          grep -q 'options.DefaultAuthenticateScheme = SessionCookieScheme' "$program"
          grep -q 'AuthenticateAsync(NegotiateDefaults.AuthenticationScheme)' "$program"
          grep -q 'ChallengeAsync(NegotiateDefaults.AuthenticationScheme)' "$program"
          grep -q 'CreateSessionPrincipal(windowsUser, "WindowsSSO")' "$program"
          grep -q 'VerifyMamAccessAsync(context, sessionPrincipal' "$program"
          grep -q 'SignInAsync(SessionCookieScheme, sessionPrincipal, SessionProperties())' "$program"
          if grep -q '\.AddPolicyScheme(' "$program"; then
            echo 'Routine application authentication must not auto-fallback to Windows Negotiate.' >&2
            exit 1
          fi
          echo 'COOKIE SESSION DEFAULT + EXPLICIT WINDOWS SSO BOOTSTRAP: PASS'

      - name: Cross-feature rendered-surface integration invariants
        shell: bash
        run: |
          set -euo pipefail
          media=src/MAM.Web/wwwroot/p133-media-library.js
          visual=src/MAM.Web/wwwroot/p12-visual-search.js
          asset=src/MAM.Web/wwwroot/p04-processing.js

          # Asset Details remains owned by the processing/discovery composition.
          grep -q 'id="p12AssetDiscovery"' "$asset"
          grep -q 'p12AttachAssetDiscovery' "$visual"
          grep -q 'p12AttachAssetDiscovery' "$media"
          grep -q 'data-p133-organization' "$media"

          # Opening from Media Library must select the same authoritative asset used by P12/P04.
          grep -q 'p12SelectedAssetId=assetId' "$media"

          # Visual search must be directly discoverable from Media Library.
          grep -q 'data-p133-visual-search' "$media"
          grep -q 'data-visual-mode="image"' "$visual"

          # Guard against the regression that replaced the complete Asset Details DOM.
          if grep -Fq "render=function(){baseRender();if(route==='asset'&&model.selectedAssetId)void renderDetails();};" "$media"; then
            echo 'P133 must not replace the shared Asset Details route.' >&2
            exit 1
          fi
      - name: SQL Server migration static invariants
        shell: bash
        run: |
          set -euo pipefail
          migration=database/migrations/0013_p12_media_library_date_category_trees.sql
          grep -q 'UploadedAtUtc = CreatedAtUtc' "$migration"
          grep -q 'ProductionDate date NULL' "$migration"
          grep -q "Uncategorized" "$migration"
          grep -q 'غير مصنف' "$migration"
          grep -q 'LegacyCategories' "$migration"
          grep -q 'TR_MediaAsset_DefaultCategory' "$migration"
