name: p12-setup-acceptance

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  premium-dual-setup:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Parse setup PowerShell harnesses
        shell: powershell
        run: |
          $paths = @(
            '.\eng\p12-build-setups.ps1',
            '.\eng\p12-setup-acceptance.ps1',
            '.\eng\p12-demo-setup-acceptance.ps1',
            '.\eng\p12-demo-visual-acceptance.ps1',
            '.\deploy\setup\Configure-MamServer.ps1',
            '.\deploy\setup\Prepare-MamServerUpgrade.ps1',
            '.\deploy\setup\Complete-MamServerUpgrade.ps1',
            '.\deploy\setup\Start-MamComponent.ps1',
            '.\deploy\setup\Uninstall-MamServer.ps1',
            '.\deploy\setup\Configure-MamDemo.ps1',
            '.\deploy\setup\Start-MamDemoComponent.ps1',
            '.\deploy\setup\Uninstall-MamDemo.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("{0}: {1}" -f $path, $_.Message) }
              exit 1
            }
          }
          Write-Host 'Setup PowerShell syntax: SUCCESS'
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Inno Setup compiler
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Server self-upgrade contract checks
        shell: powershell
        run: |
          $server = Get-Content -Raw '.\deploy\setup\server.iss'
          $builder = Get-Content -Raw '.\eng\p12-build-setups.ps1'
          if ($server -notmatch 'Prepare-MamServerUpgrade\.ps1') { throw 'Server Setup does not embed the pre-upgrade protection engine.' }
          if ($server -notmatch 'Complete-MamServerUpgrade\.ps1') { throw 'Server Setup does not invoke the post-upgrade completion engine.' }
          if ($server -notmatch 'PrepareToInstall') { throw 'Server Setup does not protect the live server before file replacement.' }
          if ($builder -notmatch 'Prepare-MamServerUpgrade\.ps1' -or $builder -notmatch 'Complete-MamServerUpgrade\.ps1') { throw 'Official setup builder does not package the upgrade engines.' }
          $complete = Get-Content -Raw '.\deploy\setup\Complete-MamServerUpgrade.ps1'
          if ($complete -notmatch 'Test-SignedMamSession' -or $complete -notmatch 'X-MAM-Auth-Signature') { throw 'Server upgrade completion does not verify the preserved Web-to-API auth authority.' }
          if ($complete -notmatch 'System.Net.Security.SslStream' -or $complete -notmatch 'SslProtocols]::Tls12') { throw 'Server upgrade completion does not use direct TLS 1.2 SslStream verification.' }
          if ($complete -match 'Invoke-WebRequest') { throw 'Server upgrade completion must not depend on Windows PowerShell 5.1 Invoke-WebRequest for local HTTPS verification.' }

      - name: Production Desktop gateway and no-Demo contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $iss = Get-Content -Raw '.\deploy\setup\desktop.iss'
          $config = Get-Content -Raw '.\src\MAM.Desktop\DesktopSetupConfiguration.cs'
          $transport = Get-Content -Raw '.\src\MAM.Desktop\DesktopProductionTransport.cs'
          $xaml = Get-Content -Raw '.\src\MAM.Desktop\MainWindow.xaml'
          $shell = Get-Content -Raw '.\src\MAM.Desktop\MainWindow.xaml.cs'
          $web = Get-Content -Raw '.\src\MAM.Web\Program.cs'

          foreach ($needle in @(
            "ParamOrDefault('ENVIRONMENT', 'Production')",
            "'https://mam.da.gov.kw'",
            '"environmentName"',
            '"webBaseUrl"'
          )) {
            if (-not $iss.Contains($needle)) { throw "Desktop Setup Production binding missing: $needle" }
          }

          foreach ($needle in @(
            'ProductionOrigin = "https://mam.da.gov.kw/"',
            'UseDefaultCredentials = true',
            'auth/windows?returnUrl=%2Fauth%2Fstatus',
            'client-api/',
            'request.Headers.Remove("X-MAM-Dev-User")'
          )) {
            if (-not $transport.Contains($needle)) { throw "Production Desktop transport invariant missing: $needle" }
          }

          foreach ($needle in @(
            'MAM_DESKTOP_ENVIRONMENT',
            'DOTNET_ENVIRONMENT',
            'MAM_WEB_BASE_URL',
            'MAM_DEV_USER'
          )) {
            if (-not $config.Contains($needle)) { throw "Production setup bootstrap invariant missing: $needle" }
          }

          foreach ($forbidden in @('demo.operator','DEVELOPMENT DEMO','Central API demo state','NON-PRODUCTION')) {
            if ($xaml.Contains($forbidden) -or $shell.Contains($forbidden)) {
              throw "Standard Desktop still contains visible Demo/Development shell marker: $forbidden"
            }
          }

          $desktopRuntime = (Get-ChildItem '.\src\MAM.Desktop\MainWindow*.cs' -File | ForEach-Object { Get-Content -Raw $_.FullName }) -join [Environment]::NewLine
          if ($desktopRuntime -match 'Environment\.GetEnvironmentVariable\("MAM_DEV_USER"\)') {
            throw 'A Desktop page bypasses the Production identity policy and reads MAM_DEV_USER directly.'
          }
          if ($desktopRuntime -match 'new\s+HttpClient\s*(\{|\()') {
            throw 'A Desktop page creates HttpClient directly instead of DesktopProductionTransport.'
          }
          if ($web -notmatch 'normalized\.StartsWith\("health/"') {
            throw 'Web Production gateway does not proxy Desktop health endpoints.'
          }

          Write-Host 'PRODUCTION DESKTOP GATEWAY + NO-DEMO CONTRACT: SUCCESS'

      - name: Production Web to API loopback transport contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $runner = Get-Content -Raw '.\deploy\setup\Start-MamComponent.ps1'
          $transport = Get-Content -Raw '.\src\MAM.Web\MamWebApiTransport.cs'

          foreach ($needle in @(
            '$env:MAM_API_CONNECT_LOOPBACK = ''1''',
            '$env:MAM_API_BASE_URL = "${scheme}://${PublicHost}:$ApiPort/"'
          )) {
            if (-not $runner.Contains($needle)) { throw "Web/API loopback runner invariant missing: $needle" }
          }

          foreach ($needle in @(
            'MAM_API_CONNECT_LOOPBACK',
            'SocketsHttpHandler',
            'ConnectCallback',
            'IPAddress.Loopback',
            'context.DnsEndPoint.Port'
          )) {
            if (-not $transport.Contains($needle)) { throw "Web/API loopback transport invariant missing: $needle" }
          }

          Write-Host 'PRODUCTION WEB -> CENTRAL API LOOPBACK TRANSPORT: SUCCESS'

      - name: Build Desktop Server and Offline Demo Setup EXEs
        shell: powershell
        run: .\eng\p12-build-setups.ps1 -OutputRoot "$env:RUNNER_TEMP\mam-setups"
      - name: Premium server and desktop setup acceptance
        shell: powershell
        run: .\eng\p12-setup-acceptance.ps1 -SetupRoot "$env:RUNNER_TEMP\mam-setups"
      - name: Offline Demo clean install runtime acceptance
        shell: powershell
        run: .\eng\p12-demo-setup-acceptance.ps1 -SetupRoot "$env:RUNNER_TEMP\mam-setups"
      - name: Offline Demo visual search installed-runtime acceptance
        shell: powershell
        run: .\eng\p12-demo-visual-acceptance.ps1 -SetupRoot "$env:RUNNER_TEMP\mam-setups"
      - name: Collect server configuration diagnostics
        if: failure()
        shell: powershell
        run: |
          $destinationRoot = Join-Path $env:RUNNER_TEMP 'mam-setups\_acceptance-diagnostics'
          New-Item -ItemType Directory -Force -Path $destinationRoot | Out-Null
          foreach ($source in @(
            (Join-Path $env:ProgramData 'Diwan Al Amiri\MAM\logs\configure-server-error.log'),
            (Join-Path $env:ProgramData 'Diwan Al Amiri\MAM Demo\logs\configure-demo-error.log')
          )) {
            if (Test-Path -LiteralPath $source) {
              Copy-Item -LiteralPath $source -Destination (Join-Path $destinationRoot ([IO.Path]::GetFileName($source))) -Force
              Get-Content -LiteralPath $source | ForEach-Object { Write-Host $_ }
            }
          }
      - name: Upload Desktop Server and Demo Setup EXEs and manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DiwanMAM-Premium-Setups-${{ github.sha }}
          path: ${{ runner.temp }}\mam-setups\*
          if-no-files-found: error
